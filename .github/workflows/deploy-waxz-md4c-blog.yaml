on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Admin email(s), comma separated. Needed on the first run; leave empty later to keep the current list"
        default: ""
      blog_domain:
        description: "Optional: blog hostname (e.g. blog.example.com). Empty = the bucket's r2.dev URL"
        default: ""
      admin_domain:
        description: "Optional: admin hostname (e.g. admin.example.com). Empty = <worker>.<subdomain>.workers.dev"
        default: ""
      seed_samples:
        description: "Upload the sample posts (first run only)"
        type: boolean
        default: false
      md4c_ref:
        description: "Branch, tag or commit of waxz/md4c"
        default: "claude/wasm-browser-blog"

name: deploy-waxz/md4c-blog

# Deploys the md4c blog (wasm/ in waxz/md4c):
#   - the blog: static files in a public R2 bucket
#   - the admin Worker, protected by Cloudflare Access
#
# Only the two secrets the other workflows use are needed:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Everything else (buckets, public URL, Access application and policy, AUD
# tag, team domain, the admin's settings KV namespace) is created or
# discovered by
# .github/scripts/md4c-blog-cloudflare.mjs. See the README for the token
# permissions and the one-time Zero Trust step.

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BLOG_BUCKET: md4c-blog
      DRAFTS_BUCKET: md4c-blog-drafts
      WORKER_NAME: md4c-blog-admin
    steps:
      - uses: actions/checkout@v5
        with:
          path: ./deploy

      - uses: actions/checkout@v5
        with:
          repository: waxz/md4c
          ref: ${{ inputs.md4c_ref }}
          path: ./md4c

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./md4c/wasm/package-lock.json

      - name: Build and test
        working-directory: ./md4c/wasm
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld
          npm ci
          npm run build
          npm test

      - name: Set up Cloudflare (buckets, public URL, Access)
        id: cf
        env:
          ADMIN_EMAILS: ${{ inputs.admin_email }}
          BLOG_DOMAIN: ${{ inputs.blog_domain }}
          ADMIN_DOMAIN: ${{ inputs.admin_domain }}
        run: node ./deploy/.github/scripts/md4c-blog-cloudflare.mjs

      - name: Publish the blog
        working-directory: ./md4c/wasm
        env:
          PUBLIC_URL: ${{ steps.cf.outputs.public_url }}
        run: |
          # R2's S3 API keys come from the API token itself:
          # Access Key ID = the token's id, secret = SHA-256 of the token.
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -sS -H "$auth" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.id // empty')
          [ -n "$id" ] || id=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -r '.result.id // empty')
          [ -n "$id" ] || { echo "::error::Could not verify CLOUDFLARE_API_TOKEN"; exit 1; }
          secret=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$id"
          echo "::add-mask::$secret"

          # Uploads the site's code and rebuilds the pages from the posts in
          # the bucket; posts written in the admin are never touched.
          posts=(--no-posts)
          [ "${{ inputs.seed_samples }}" = "true" ] && posts=(--posts blog/posts)
          R2_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" R2_BUCKET="$BLOG_BUCKET" R2_ACCESS_KEY_ID="$id" R2_SECRET_ACCESS_KEY="$secret" \
            node scripts/publish.mjs --to r2 --site "${posts[@]}" --site-url "$PUBLIC_URL"

      - name: Write the admin Worker config
        working-directory: ./md4c/wasm
        env:
          ADMIN_HOST: ${{ steps.cf.outputs.admin_host }}
          ON_WORKERS_DEV: ${{ steps.cf.outputs.admin_on_workers_dev }}
          ACCESS_TEAM_DOMAIN: ${{ steps.cf.outputs.access_team_domain }}
          ACCESS_AUD: ${{ steps.cf.outputs.access_aud }}
          PUBLIC_URL: ${{ steps.cf.outputs.public_url }}
          KV_ID: ${{ steps.cf.outputs.kv_namespace_id }}
        run: |
          kv=''
          if [ -n "$KV_ID" ]; then
            kv=$(printf '[[kv_namespaces]]\nbinding = "SETTINGS"\nid = "%s"' "$KV_ID")
          fi
          if [ "$ON_WORKERS_DEV" = "true" ]; then
            route='workers_dev = true'
          else
            route=$(printf 'workers_dev = false\nroutes = [{ pattern = "%s", custom_domain = true }]' "$ADMIN_HOST")
          fi
          cat > admin/wrangler.ci.toml <<EOF
          name = "$WORKER_NAME"
          main = "src/worker.js"
          compatibility_date = "2025-09-01"
          compatibility_flags = ["nodejs_compat"]
          preview_urls = false
          $route

          [assets]
          directory = "../dist/admin"
          binding = "ASSETS"
          run_worker_first = true

          [[r2_buckets]]
          binding = "SITE"
          bucket_name = "$BLOG_BUCKET"

          [[r2_buckets]]
          binding = "DRAFTS"
          bucket_name = "$DRAFTS_BUCKET"

          $kv

          [vars]
          ACCESS_TEAM_DOMAIN = "$ACCESS_TEAM_DOMAIN"
          ACCESS_AUD = "$ACCESS_AUD"
          PUBLIC_URL = "$PUBLIC_URL"
          EOF
          cat admin/wrangler.ci.toml

      - name: Deploy the admin Worker
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: "./md4c/wasm"
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config admin/wrangler.ci.toml

      - name: Summary
        run: |
          {
            echo "### md4c blog deployed"
            echo "- Blog: ${{ steps.cf.outputs.public_url }}index.html"
            echo "- Admin: https://${{ steps.cf.outputs.admin_host }}/ (sign in with your admin email)"
          } >> "$GITHUB_STEP_SUMMARY"
